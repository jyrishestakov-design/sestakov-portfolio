backend:
  name: github
  repo: jyrishestakov-design/sestakov-portfolio
  branch: main
  base_url: https://sestakov-cms-auth.artcontainer-cms.workers.dev
  auth_endpoint: auth

site_url: https://jyrishestakov-design.github.io/sestakov-portfolio/

media_folder: "content/uploads"
public_folder: "/content/uploads"

collections:
  - name: "site"
    label: "Portfoolio"
    editor:
      preview: false
    files:
      - name: "main"
        label: "Sisu"
        file: "content/site.json"
        fields:
          - label: "Üldinfo"
            name: "settings"
            widget: "object"
            fields:
              - { label: "Nimi", name: "name", widget: "string" }
              - label: "Rollid"
                name: "roles"
                widget: "list"
                field: { label: "Roll", name: "role", widget: "string" }
              - { label: "Asukoht", name: "location", widget: "string" }
              - { label: "Avalause (hero all)", name: "statement", widget: "text" }
              - label: "Kontakt — e-post"
                name: "contactEmail"
                widget: "object"
                hint: "Kaheks tükeldatud (enne/pärast @), et boti otsing toorest failist e-posti ei leiaks. Lehel näidatakse neid siiski koos, tavalise mailto-lingina."
                fields:
                  - { label: "Enne @ (nt jyri.shestakov)", name: "user", widget: "string" }
                  - { label: "Domeen (nt gmail.com)", name: "domain", widget: "string" }
              - { label: "Kontakt — telefon", name: "contactPhone", widget: "string", required: false }
              - label: "Reel"
                name: "reel"
                widget: "object"
                fields:
                  - { label: "Pealkiri", name: "title", widget: "string" }
                  - { label: "Märkus", name: "note", widget: "text" }
                  - label: "Video embed URL"
                    name: "embedUrl"
                    widget: "string"
                    required: false
                    hint: "Vimeo/YouTube EMBED-link (nt https://player.vimeo.com/video/XXXXXXX või https://www.youtube.com/embed/XXXXXXXXXXX). Tühjaks jätmine näitab täitmata plaatsi."
                  - label: "Kaanepilt (kui video pole veel lisatud)"
                    name: "image"
                    widget: "image"
                    required: false
                    hint: "Kuvatakse ainult siis, kui Video embed URL on tühi."
              - label: "Mustandi märkused"
                name: "draftNotices"
                widget: "object"
                hint: "Kollane hoiatuskast iga sektsiooni all. Tühjaks jätmine peidab kasti."
                fields:
                  - { label: "Shot Log märkus", name: "log", widget: "text", required: false }
                  - { label: "Oskuste märkus", name: "caps", widget: "text", required: false }
                  - { label: "Index märkus", name: "index", widget: "text", required: false }
          - label: "Tööd (Shot Log)"
            name: "works"
            widget: "list"
            summary: "{{year}} — {{title}}"
            fields:
              - { label: "Täitmata koht (placeholder)", name: "todo", widget: "boolean", default: false }
              - label: "Kaader (pilt, valikuline)"
                name: "image"
                widget: "image"
                required: false
                hint: "Tühjaks jätmine näitab värviriba test-kaadrit."
              - { label: "Pealkiri", name: "title", widget: "string" }
              - { label: "Originaalpealkiri / EN (valikuline)", name: "titleEn", widget: "string", required: false }
              - { label: "Rollid (rea all, väike tekst)", name: "roles", widget: "string" }
              - { label: "Aasta", name: "year", widget: "string" }
              - { label: "Roll", name: "role", widget: "string", required: false }
              - { label: "Tüüp", name: "type", widget: "string", required: false }
              - { label: "Kestus", name: "duration", widget: "string", required: false }
              - { label: "Tööriistad", name: "tools", widget: "string", required: false }
              - { label: "Tootja / klient", name: "producer", widget: "string", required: false }
              - { label: "Režii", name: "director", widget: "string", required: false }
              - { label: "Operaator", name: "cinematographer", widget: "string", required: false }
              - { label: "Allikas", name: "source", widget: "string", required: false }
              - { label: "Formaat", name: "format", widget: "string", required: false }
              - { label: "Kaamera", name: "camera", widget: "string", required: false }
              - { label: "Objektiiv", name: "lens", widget: "string", required: false }
              - { label: "FPS", name: "fps", widget: "string", required: false }
              - { label: "Link (Vimeo/YouTube/muu)", name: "link", widget: "string", required: false }
              - { label: "Märkus (spec-lehe all)", name: "note", widget: "text", required: false }
          - label: "Veebilehed"
            name: "websites"
            widget: "object"
            fields:
              - { label: "Sissejuhatus", name: "note", widget: "text", required: false }
              - label: "Lehed"
                name: "items"
                widget: "list"
                required: false
                summary: "{{title}} — {{url}}"
                fields:
                  - { label: "Nimi", name: "title", widget: "string" }
                  - { label: "Aadress (URL)", name: "url", widget: "string", required: false, hint: "Täielik aadress, nt https://kakerdaja.eu. Tühjaks jätmine näitab „Link tulekul“." }
                  - label: "Ekraanipilt"
                    name: "image"
                    widget: "image"
                    required: false
                    hint: "Lehe ülaosa kuvatõmmis (laius ~1600 px, kõrgus/laius ~10:16). Tühjaks jätmine näitab nime ruudustikul."
                  - { label: "Klient", name: "client", widget: "string", required: false }
                  - { label: "Tüüp", name: "type", widget: "string", required: false }
                  - { label: "Aasta", name: "year", widget: "string", required: false }
                  - { label: "Kirjeldus", name: "description", widget: "text", required: false }
                  - { label: "Tehnoloogia", name: "stack", widget: "string", required: false, hint: "nt Next.js · Prisma · Netlify" }
          - label: "Failid (allalaadimiseks)"
            name: "files"
            widget: "object"
            hint: "NB! Repo on avalik — siia laetud failid on kõigile nähtavad. Privaatsed ja suured failid käivad klienditsooni kaudu (portaali URL allpool)."
            fields:
              - { label: "Sissejuhatus", name: "note", widget: "text", required: false }
              - label: "Klienditsooni URL"
                name: "portalUrl"
                widget: "string"
                required: false
                hint: "Cloudflare Workeri aadress, nt https://failid.shesta.eu. Tühjaks jätmine peidab klienditsooni kasti."
              - label: "Avalikud failid"
                name: "items"
                widget: "list"
                required: false
                summary: "{{title}}"
                fields:
                  - { label: "Nimetus", name: "title", widget: "string" }
                  - { label: "Fail", name: "file", widget: "file", hint: "Väikesed failid (PDF, pildid, lühiklipid). Kuni ~25 MB." }
                  - { label: "Märkus", name: "note", widget: "string", required: false }
